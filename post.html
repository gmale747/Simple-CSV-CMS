<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'">
  <title>Article | Road Construction Help Center</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
  <a class="visually-hidden-focusable" href="#main">Skip to main content</a>

  <nav class="navbar navbar-dark site-nav">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <span class="brand-mark" aria-hidden="true"></span> Road Construction Help Center
      </a>
    </div>
  </nav>

  <main id="main" class="container py-5">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="index.html">All articles</a></li>
        <li class="breadcrumb-item active" aria-current="page" id="crumb">Article</li>
      </ol>
    </nav>

    <article id="article" class="row g-5">
      <div class="col-lg-8">
        <span id="post-category" class="badge category-badge mb-3"></span>
        <h1 id="post-name" class="display-6 fw-bold"></h1>
        <p id="post-header" class="lead text-body-secondary"></p>
        <img id="post-image" class="img-fluid rounded-3 my-4 w-100" alt="">
        <div id="post-body" class="post-body"></div>
      </div>
      <aside class="col-lg-4" aria-labelledby="related-heading">
        <h2 id="related-heading" class="h5 fw-bold">More in this category</h2>
        <ul id="related" class="list-unstyled mt-3"></ul>
        <a href="index.html" class="btn btn-outline-dark mt-2">Back to all articles</a>
      </aside>
    </article>
    <p id="error" class="alert alert-warning d-none" role="alert"></p>
  </main>

  <footer class="site-footer py-4">
    <div class="container small">
      Test application for the standards compliance pipeline. Content is sample text.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"
          integrity="sha384-D/t0ZMqQW31H3az8ktEiNb39wyKnS82iFY52QPACM+IjKW3jDUhyIgh2PApRqJZs"
          crossorigin="anonymous"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/post.js"></script>
</body>
</html>
